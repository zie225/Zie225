name: Update Profile Cards

on:
  push:
    branches: [master]
    paths:
      - "scripts/generate_profile_cards.py"
      - ".github/workflows/update-profile-cards.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/generate_profile_cards.py

      - name: Commit generated cards
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile/stats.svg profile/top-langs.svg profile/streak.svg

          if git diff --cached --quiet; then
            echo "No profile card changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile cards"
          git push
